<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoindre une soirée — SoberMate</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
  PAGE VIVANTE D'INVITATION (tranche 3)
  ════════════════════════════════════════════════════════════════════════════
  AVANT : cette page ne faisait que rebondir vers le store au bout de 1,6 s. On
  demandait donc d'installer une app dont on n'avait RIEN vu. Taux de conversion
  garanti proche de zéro.

  MAINTENANT : on VOIT la soirée en cours (qui en est, qui est rentré) sans rien
  installer, et l'app n'est requise que pour AGIR. C'est le schéma
  Partiful/Splitwise : la valeur d'abord, l'installation ensuite.

  CE QUE LA PAGE N'AFFICHE JAMAIS — et c'est délibéré :
    • aucune alcoolémie, ni chiffre ni statut ;
    • aucune position.
  Deux raisons. (1) Confidentialité : le code circule dans des groupes de
  discussion ; des prénoms sur une page d'invitation est banal, l'état d'ébriété
  de personnes identifiables ne l'est pas — c'est de la donnée de santé.
  (2) Produit : c'est précisément ce qui rend l'app DÉSIRABLE. La page montre
  qu'il se passe quelque chose ; pour savoir où en est chacun, il faut l'app.
  Valeur asymétrique, pas privation.

  ⚠️ À CONFIGURER avant mise en ligne (cf. SUPABASE_URL / SUPABASE_ANON_KEY
  ci-dessous). Tant que ce n'est pas fait, la page se comporte comme avant :
  deep link + bouton store, sans état en direct. Aucune régression.
-->
<style>
  :root { --bg:#0A1B2E; --fg:#E8EEF5; --muted:#9FB3C8; --accent:#38BDF8; --btn:#0A4FA6;
          --card:#122740; --border:#1C3754; --green:#4ADE80; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); text-align:center;
         min-height:100vh; margin:0; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:28px 20px; }
  .mark { line-height:0; margin-bottom:10px; }
  h1 { font-size:24px; margin:0 0 2px; }
  .code { font-size:14px; color:var(--muted); margin:4px 0 18px; }
  .code b { color:var(--accent); letter-spacing:4px; }
  p { color:var(--muted); font-size:15px; line-height:1.5; max-width:420px; margin:0; }
  .panel { width:100%; max-width:420px; margin:6px 0 18px; }
  .title { font-size:18px; font-weight:700; color:var(--fg); margin-bottom:12px; }
  .people { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip { display:flex; align-items:center; gap:7px; background:var(--card);
          border:1px solid var(--border); border-radius:999px;
          padding:9px 14px; font-size:15px; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .chip.home .dot { background:var(--green); }
  .chip .home-tag { font-size:12px; color:var(--green); font-weight:700; }
  .tease { margin-top:14px; font-size:14px; color:var(--muted); }
  .tease b { color:var(--accent); }
  a.btn { display:inline-block; margin-top:6px; background:var(--btn); color:#fff;
          text-decoration:none; font-weight:700; padding:14px 24px; border-radius:12px;
          font-size:16px; }
  .sub { margin-top:12px; font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5CC8F5"/>
          <stop offset="1" stop-color="#0A4FA6"/>
        </linearGradient>
        <clipPath id="shieldClip">
          <path d="M50 18 L76 27 C78 28 79 30 79 33 L79 52 C79 68 66 80 50 86 C34 80 21 68 21 52 L21 33 C21 30 22 28 24 27 Z"/>
        </clipPath>
      </defs>
      <path d="M50 18 L76 27 C78 28 79 30 79 33 L79 52 C79 68 66 80 50 86 C34 80 21 68 21 52 L21 33 C21 30 22 28 24 27 Z" fill="url(#shield)"/>
      <g clip-path="url(#shieldClip)">
        <path d="M21 60 Q35 54 50 60 T79 60 L79 90 L21 90 Z" fill="#34D6E0" opacity="0.92"/>
      </g>
      <path d="M50 30 C56 40 59 45 59 49 A9 9 0 1 1 41 49 C41 45 44 40 50 30 Z" fill="#FFFFFF" opacity="0.95"/>
    </svg>
  </div>
  <h1>Sober<span style="color:#38BDF8">Mate</span></h1>
  <p class="code" id="code"></p>

  <!-- État EN DIRECT de la soirée (masqué tant qu'on n'a rien à montrer). -->
  <div class="panel hidden" id="live">
    <div class="title" id="liveTitle"></div>
    <div class="people" id="people"></div>
    <p class="tease" id="tease"></p>
  </div>

  <p id="msg">Ouverture de l'application… · Opening the app…</p>
  <a class="btn" id="store" href="#">Rejoindre avec l'app · Join with the app</a>
  <p class="sub" id="sub"></p>

<script>
  (function () {
    // ── À CONFIGURER ────────────────────────────────────────────────────────
    // Laisser vide → la page reste un simple tremplin vers le store (pas d'état
    // en direct), exactement comme avant. La clé « anon » est PUBLIQUE par
    // conception (protégée par la RLS) : elle est déjà embarquée dans l'app.
    var SUPABASE_URL      = 'https://fjnsmjbqaymunkugmouv.supabase.co';   // ex. 'https://xxxxxxxx.supabase.co'
    var SUPABASE_ANON_KEY = 'sb_publishable_SunYkGHIPXZv3Qy3I6NAzQ_1XTufW02';   // ex. 'sb_publishable_...'

    // ⚠️ IOS : remplacer idXXXXXXXXX par l'identifiant App Store une fois publié.
    var ANDROID = 'https://play.google.com/store/apps/details?id=com.ameig.MonApplicationSoberMate';
    var IOS     = 'https://testflight.apple.com/join/V4QT1a9W';

    var REFRESH_MS = 20000;

    var params = new URLSearchParams(location.search);
    var code = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var store = isIOS ? IOS : ANDROID;
    var deepLink = code ? 'monapplicationsobermate://join?code=' + encodeURIComponent(code) : null;

    var $ = function (id) { return document.getElementById(id); };
    if (code) $('code').innerHTML = 'Code : <b>' + code + '</b>';

    // Le bouton tente D'ABORD l'app installée, puis bascule vers le store. Plus
    // de redirection AUTOMATIQUE : elle expédiait le visiteur au store avant même
    // qu'il ait rien vu — c'est exactement ce que cette page corrige.
    $('store').addEventListener('click', function (e) {
      e.preventDefault();
      if (deepLink) location.href = deepLink;
      setTimeout(function () { location.href = store; }, 1200);
    });

    // Tentative silencieuse à l'arrivée : si l'app est installée, elle s'ouvre et
    // le visiteur ne voit jamais cette page. Sinon il reste ici, et il a du contenu.
    if (deepLink) location.href = deepLink;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function render(data) {
      var members = (data && data.members) || [];
      if (!members.length) return;
      var captain = data.captain ? escapeHtml(data.captain) : null;
      $('liveTitle').textContent = captain
        ? 'La soirée de ' + captain
        : 'Une soirée est en cours';
      $('people').innerHTML = members.map(function (m) {
        var home = !!m.home;
        return '<span class="chip' + (home ? ' home' : '') + '">'
             + '<span class="dot"></span>' + escapeHtml(m.name || '?')
             + (home ? '<span class="home-tag">rentré·e</span>' : '')
             + '</span>';
      }).join('');
      var n = members.length;
      $('tease').innerHTML = n + (n > 1 ? ' personnes en soirée. ' : ' personne en soirée. ')
        + "<b>Ouvre l'app</b> pour voir où en est chacun.";
      $('live').classList.remove('hidden');
      $('msg').classList.add('hidden');
      $('sub').textContent = 'Mise à jour automatique · Live';
    }

    function poll() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !code) return;
      fetch(SUPABASE_URL + '/rest/v1/rpc/public_group_view', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ p_code: code }),
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        // Échec réseau / groupe inconnu ou expiré → on ne montre rien de plus, la
        // page reste un tremplin valide. Jamais de message d'erreur : l'invité n'a
        // rien à faire de nos soucis de serveur.
        .then(function (d) { if (d) render(d); })
        .catch(function () {});
    }

    poll();
    setInterval(poll, REFRESH_MS);
  })();
</script>
</body>
</html>
